name: reproducibility

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip install -e . --no-deps
      - run: python scripts/reproduce_all.py
      - run: python -m pytest
      - run: python -m nbconvert --to notebook --execute reproduce_report_figures.ipynb --output /tmp/reproduce_report_figures.executed.ipynb --ExecutePreprocessor.timeout=180
      - name: Verify committed CSV outputs are current
        run: git diff --exit-code -- data/output
